<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omni-Daemon · Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* -- color tokens -- */
    --void:#0a0e16;
    --void-deep:#05070c;
    --panel:#10141d;
    --panel-raised:#171c27;
    --card:#1b212e;
    --line:#262d3d;
    --line-soft:#1b212c;

    --text-main:#e9e6dd;
    --text-muted:#838a9c;
    --text-dim:#4d5266;

    --brass:#c9973f;
    --brass-bright:#e7b563;
    --brass-dim:#5c4a26;
    --brass-wash:rgba(201,151,63,0.10);

    --spirit:#4fd8c4;
    --spirit-dim:#245f57;
    --spirit-wash:rgba(79,216,196,0.10);

    --danger:#dd5b4d;
    --danger-dim:#5c342e;
    --danger-wash:rgba(221,91,77,0.10);

    /* -- geometry -- */
    --r-lg:14px;
    --r-md:8px;
    --r-sm:4px;

    /* -- type -- */
    --f-display:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --f-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family:var(--f-display);
    background-color:var(--void);
    color:var(--text-main);
    margin:0;
    padding:20px;
    display:flex;
    gap:20px;
    overflow:hidden;
    position:relative;
  }

  /* ambient dot-grid + vignette, purely atmospheric */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(233,230,221,0.05) 1px, transparent 0);
    background-size:26px 26px;
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
    pointer-events:none;
    z-index:0;
  }

  .sidebar, .main-content{ position:relative; z-index:1; }

  ::-webkit-scrollbar{ width:7px; height:7px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--text-dim); }

  :focus-visible{
    outline:2px solid var(--spirit);
    outline-offset:2px;
    border-radius:var(--r-sm);
  }

  /* ============ SIGNATURE SEAL ============ */
  .seal-svg{ display:block; overflow:visible; }
  .seal-svg .seal-outer, .seal-svg .seal-inner, .seal-svg .seal-strut{
    fill:none;
    stroke:var(--text-dim);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke 0.6s ease;
  }
  .seal-svg .seal-core{
    fill:var(--text-dim);
    transition:fill 0.6s ease;
  }
  .seal-svg .seal-inner{ transform-origin:50px 50px; }

  /* checking */
  .seal--checking .seal-outer,
  .seal--checking .seal-inner,
  .seal--checking .seal-strut{ stroke:var(--text-dim); }
  .seal--checking .seal-core{ fill:var(--text-dim); }

  /* online */
  .seal--online .seal-outer,
  .seal--online .seal-strut{ stroke:var(--brass); }
  .seal--online .seal-inner{ stroke:var(--brass-bright); }
  .seal--online .seal-core{ fill:var(--spirit); }

  /* offline */
  .seal--offline .seal-outer,
  .seal--offline .seal-inner,
  .seal--offline .seal-strut{ stroke:var(--danger); }
  .seal--offline .seal-core{ fill:var(--danger); }

  /* processing */
  .seal--processing .seal-outer,
  .seal--processing .seal-strut{ stroke:var(--brass); }
  .seal--processing .seal-inner{ stroke:var(--spirit); }
  .seal--processing .seal-core{ fill:var(--spirit); }

  @media (prefers-reduced-motion:no-preference){
    .seal--online .seal-core{ animation:corePulse 2.6s ease-in-out infinite; }
    .seal--processing .seal-inner{ animation:sealSpin 2.2s linear infinite; }
    .seal--processing .seal-core{ animation:corePulse 0.9s ease-in-out infinite; }
    .seal--offline .seal-outer{ animation:sealFlicker 0.6s ease-in-out 1; }
  }
  @keyframes corePulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.45; transform:scale(0.82); }
  }
  @keyframes sealSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  @keyframes sealFlicker{
    0%,100%{ opacity:1; }
    30%{ opacity:0.2; }
    60%{ opacity:0.8; }
  }

  .watermark-seal{
    position:absolute;
    top:-30px;
    right:-30px;
    width:220px;
    height:220px;
    opacity:0.04;
    pointer-events:none;
    z-index:0;
  }

  /* ============ SIDEBAR ============ */
  .sidebar{
    width:280px;
    flex-shrink:0;
    background-color:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    padding:20px;
    display:flex;
    flex-direction:column;
    order:2;
  }
  .sidebar-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-header h3{
    margin:0;
    font-family:var(--f-mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:1.6px;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  .clear-btn{
    background:none;
    border:none;
    padding:0;
    font-family:var(--f-mono);
    font-size:11px;
    letter-spacing:0.4px;
    color:var(--text-dim);
    cursor:pointer;
    transition:color 0.15s ease;
  }
  .clear-btn:hover{ color:var(--danger); }
  .sidebar-sub{
    font-size:11px;
    color:var(--text-dim);
    margin:10px 0 14px;
    font-family:var(--f-mono);
  }
  .history-container{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .empty-log{
    color:var(--text-dim);
    font-size:12.5px;
    line-height:1.6;
    padding:14px 2px;
  }
  .history-item{
    padding:10px 12px;
    background-color:var(--card);
    border:1px solid var(--line-soft);
    border-radius:var(--r-md);
    cursor:pointer;
    transition:border-color 0.15s ease, background-color 0.15s ease;
  }
  .history-item:hover, .history-item:focus-visible{
    border-color:var(--brass-dim);
    background-color:var(--brass-wash);
  }
  .history-item.active{
    border-color:var(--brass);
    background-color:var(--brass-wash);
  }
  .history-item-top{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:5px;
  }
  .history-dot{
    width:6px; height:6px;
    border-radius:50%;
    flex-shrink:0;
  }
  .history-dot.ok{ background:var(--spirit); }
  .history-dot.err{ background:var(--danger); }
  .history-time{
    font-family:var(--f-mono);
    font-size:10.5px;
    color:var(--text-dim);
    letter-spacing:0.3px;
  }
  .history-intent{
    font-size:12.5px;
    color:var(--text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .history-item:hover .history-intent, .history-item.active .history-intent{ color:var(--text-main); }

  /* ============ MAIN ============ */
  .main-content{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow:hidden;
    order:1;
    min-width:0;
  }

  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background-color:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    padding:14px 22px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-text .logo{
    font-size:19px;
    font-weight:600;
    letter-spacing:1px;
    margin:0;
    line-height:1.1;
  }
  .logo .accent{ color:var(--brass); }
  .brand-text .tagline{
    font-family:var(--f-mono);
    font-size:10.5px;
    letter-spacing:0.6px;
    color:var(--text-dim);
    margin-top:2px;
  }

  .status-badge{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:var(--f-mono);
    font-size:12px;
    font-weight:500;
    padding:7px 14px 7px 10px;
    background-color:var(--card);
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--text-muted);
  }

  /* ============ INPUT CARD ============ */
  .input-card{
    background-color:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    padding:20px 22px;
  }
  .input-eyebrow{
    font-family:var(--f-mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:1.6px;
    color:var(--brass);
    text-transform:uppercase;
    margin:0 0 12px;
  }
  textarea{
    width:100%;
    height:82px;
    background-color:var(--void-deep);
    color:var(--text-main);
    border:1px solid var(--line);
    border-radius:var(--r-md);
    padding:13px 14px;
    font-family:var(--f-mono);
    font-size:13.5px;
    line-height:1.5;
    resize:none;
    outline:none;
    transition:border-color 0.2s ease;
  }
  textarea::placeholder{ color:var(--text-dim); }
  textarea:focus{ border-color:var(--brass-dim); }

  .action-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
  }
  .hint{
    font-family:var(--f-mono);
    font-size:11px;
    color:var(--text-dim);
  }
  .hint kbd{
    font-family:var(--f-mono);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px 5px;
    color:var(--text-muted);
  }

  button.invoke{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background-color:var(--brass);
    color:#1a1204;
    border:none;
    padding:11px 22px;
    font-family:var(--f-display);
    font-size:14px;
    font-weight:600;
    letter-spacing:0.2px;
    border-radius:var(--r-md);
    cursor:pointer;
    transition:background-color 0.15s ease, transform 0.1s ease;
  }
  button.invoke:hover:not(:disabled){ background-color:var(--brass-bright); transform:translateY(-1px); }
  button.invoke:active:not(:disabled){ transform:translateY(0); }
  button.invoke:disabled{ background-color:var(--line); color:var(--text-dim); cursor:not-allowed; transform:none; }
  button.invoke svg{ width:14px; height:14px; }

  /* ============ PANELS ============ */
  .panels-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    flex:1;
    min-height:0;
  }
  .panel{
    background-color:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  .panel-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 16px;
    background-color:var(--panel-raised);
    border-bottom:1px solid var(--line);
    font-family:var(--f-mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:1.2px;
    color:var(--text-muted);
    text-transform:uppercase;
    flex-shrink:0;
  }
  .panel-header svg{ width:13px; height:13px; opacity:0.7; }
  .panel-body{
    flex:1;
    padding:18px;
    overflow-y:auto;
    background-color:var(--void-deep);
    position:relative;
  }
  pre{
    margin:0;
    color:var(--text-main);
    font-family:var(--f-mono);
    font-size:13px;
    line-height:1.65;
    white-space:pre-wrap;
    word-wrap:break-word;
    position:relative;
    z-index:1;
  }
  .error-text{ color:var(--danger) !important; }

  .preview-shell{
    height:100%;
    background:#e7e9ee;
    padding:14px;
  }
  iframe{
    width:100%;
    height:100%;
    background:#fff;
    border:none;
    border-radius:var(--r-sm);
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:960px){
    body{ flex-direction:column; overflow-y:auto; height:auto; min-height:100vh; }
    .sidebar{ width:100%; order:1; max-height:180px; }
    .main-content{ order:2; }
    .history-container{ flex-direction:row; overflow-x:auto; overflow-y:hidden; }
    .history-item{ min-width:220px; flex-shrink:0; }
  }
  @media (max-width:700px){
    .panels-grid{ grid-template-columns:1fr; grid-template-rows:280px 280px; }
    .top-bar{ flex-wrap:wrap; gap:10px; }
  }
</style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>Invocation Log</h3>
      <button class="clear-btn" id="clearBtn" type="button">Clear</button>
    </div>
    <div class="history-container" id="historyList">
      <span class="empty-log">No invocations yet. Describe an intent to begin.</span>
    </div>
  </div>

  <!-- Main -->
  <div class="main-content">

    <div class="top-bar">
      <div class="brand">
        <svg class="seal-svg seal--checking" id="logoSeal" width="34" height="34" viewBox="0 0 100 100" aria-hidden="true">
          <polygon class="seal-outer" points="50,10 84.64,30 84.64,70 50,90 15.36,70 15.36,30"/>
          <polygon class="seal-inner" points="50,30 67.32,40 67.32,60 50,70 32.68,60 32.68,40"/>
          <circle class="seal-core" cx="50" cy="50" r="4.5"/>
        </svg>
        <div class="brand-text">
          <h1 class="logo">OMNI <span class="accent">DAEMON</span></h1>
          <div class="tagline">// a background process for turning intent into interface</div>
        </div>
      </div>
      <div class="status-badge">
        <svg class="seal-svg seal--checking" id="statusSeal" width="16" height="16" viewBox="0 0 100 100" aria-hidden="true">
          <polygon class="seal-outer" points="50,10 84.64,30 84.64,70 50,90 15.36,70 15.36,30"/>
          <polygon class="seal-inner" points="50,30 67.32,40 67.32,60 50,70 32.68,60 32.68,40"/>
          <circle class="seal-core" cx="50" cy="50" r="4.5"/>
        </svg>
        <span id="statusText">Searching for daemon…</span>
      </div>
    </div>

    <div class="input-card">
      <p class="input-eyebrow">Declare Intent</p>
      <textarea id="intentInput" placeholder="Describe what you want the daemon to build — e.g. an interactive weather widget in HTML and JS"></textarea>
      <div class="action-row">
        <span class="hint"><kbd>⌘</kbd> / <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to invoke</span>
        <button class="invoke" id="executeBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-14h-8l1-6z"/></svg>
          <span id="executeBtnLabel">Invoke Daemon</span>
        </button>
      </div>
    </div>

    <div class="panels-grid">
      <div class="panel">
        <div class="panel-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          Sandbox Output
        </div>
        <div class="panel-body" id="consoleBody">
          <svg class="seal-svg seal--checking watermark-seal" viewBox="0 0 100 100" aria-hidden="true">
            <polygon class="seal-outer" points="50,10 84.64,30 84.64,70 50,90 15.36,70 15.36,30"/>
            <polygon class="seal-inner" points="50,30 67.32,40 67.32,60 50,70 32.68,60 32.68,40"/>
            <circle class="seal-core" cx="50" cy="50" r="4.5"/>
          </svg>
          <pre id="outputDisplay" aria-live="polite">Daemon idle. Describe an intent above to begin.</pre>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
          Render Preview
        </div>
        <div class="panel-body" style="padding:0;">
          <div class="preview-shell">
            <iframe id="uiPreview" title="Render preview"></iframe>
          </div>
        </div>
      </div>
    </div>

  </div>

<script>
  const historyData = [];
  let activeHistoryIndex = null;

  const logoSeal = document.getElementById('logoSeal');
  const statusSeal = document.getElementById('statusSeal');
  const statusText = document.getElementById('statusText');
  const executeBtn = document.getElementById('executeBtn');
  const executeBtnLabel = document.getElementById('executeBtnLabel');
  const intentInput = document.getElementById('intentInput');
  const outputDisplay = document.getElementById('outputDisplay');
  const uiPreview = document.getElementById('uiPreview');
  const historyList = document.getElementById('historyList');
  const clearBtn = document.getElementById('clearBtn');

  function setSealState(state){
    [logoSeal, statusSeal].forEach(el => {
      el.classList.remove('seal--checking','seal--online','seal--offline','seal--processing');
      el.classList.add('seal--' + state);
    });
  }

  async function checkServerStatus(){
    // don't override the "processing" seal state mid-invocation
    if (executeBtn.disabled) return;
    try {
      await fetch('/omni/execute', { method: 'OPTIONS' });
      setSealState('online');
      statusText.textContent = "Daemon online";
    } catch (e) {
      setSealState('offline');
      statusText.textContent = "Daemon offline";
    }
  }
  setInterval(checkServerStatus, 3000);
  checkServerStatus();

  function placeholderPreview(message){
    return `<html><body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#838a9c;background:#0a0e16;text-align:center;padding:24px;">
      ${message}</body></html>`;
  }
  uiPreview.srcdoc = placeholderPreview("No render yet — invoke the daemon to see output here.");

  function formatTime(d){
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function runDaemon(){
    const input = intentInput.value.trim();
    if (!input) { intentInput.focus(); return; }

    outputDisplay.textContent = "Synthesizing architecture and executing in the sandbox…";
    outputDisplay.className = "";
    executeBtn.disabled = true;
    executeBtnLabel.textContent = "Invoking…";
    setSealState('processing');

    let entry = { intent: input, time: new Date(), status: 'ok', output: '', html: '' };

    try {
      const response = await fetch("http://127.0.0.1:5000/omni/execute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ intent: input })
      });

      const data = await response.json();

      if (data.status === "success") {
        const resultText = data.sandbox_output.output;
        outputDisplay.textContent = resultText;
        outputDisplay.className = "";

        let html;
        if (resultText.includes("<!DOCTYPE html>") || resultText.includes("<html>")) {
          html = resultText;
        } else {
          html = placeholderPreview("No render payload in this response — see Sandbox Output for the raw result.");
        }
        uiPreview.srcdoc = html;

        entry.status = 'ok';
        entry.output = resultText;
        entry.html = html;
      } else {
        const errText = data.error || data.sandbox_output.output;
        outputDisplay.textContent = `Daemon error\n\n${errText}`;
        outputDisplay.className = "error-text";

        entry.status = 'err';
        entry.output = `Daemon error\n\n${errText}`;
        entry.html = placeholderPreview("Execution failed — no render to show.");
      }
    } catch (error) {
      const msg = "Can't reach the daemon.\n\nStart it locally with:\n  python daemon.py\n\nThen try again.";
      outputDisplay.textContent = msg;
      outputDisplay.className = "error-text";

      entry.status = 'err';
      entry.output = msg;
      entry.html = placeholderPreview("No connection to the daemon.");
    } finally {
      executeBtn.disabled = false;
      executeBtnLabel.textContent = "Invoke Daemon";
      checkServerStatus();

      historyData.unshift(entry);
      activeHistoryIndex = 0;
      renderHistory();
    }
  }

  executeBtn.addEventListener('click', runDaemon);
  intentInput.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      runDaemon();
    }
  });

  clearBtn.addEventListener('click', () => {
    historyData.length = 0;
    activeHistoryIndex = null;
    renderHistory();
  });

  function selectHistory(index){
    const item = historyData[index];
    if (!item) return;
    activeHistoryIndex = index;
    outputDisplay.textContent = item.output;
    outputDisplay.className = item.status === 'err' ? 'error-text' : '';
    uiPreview.srcdoc = item.html;
    renderHistory();
  }

  function renderHistory(){
    historyList.innerHTML = "";
    if (historyData.length === 0) {
      const span = document.createElement('span');
      span.className = "empty-log";
      span.textContent = "No invocations yet. Describe an intent to begin.";
      historyList.appendChild(span);
      return;
    }
    historyData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = "history-item" + (index === activeHistoryIndex ? " active" : "");
      div.tabIndex = 0;
      div.setAttribute('role', 'button');

      const top = document.createElement('div');
      top.className = "history-item-top";
      const dot = document.createElement('span');
      dot.className = "history-dot " + (item.status === 'err' ? 'err' : 'ok');
      const time = document.createElement('span');
      time.className = "history-time";
      time.textContent = formatTime(item.time);
      top.appendChild(dot);
      top.appendChild(time);

      const intentEl = document.createElement('div');
      intentEl.className = "history-intent";
      intentEl.textContent = item.intent;

      div.appendChild(top);
      div.appendChild(intentEl);

      div.addEventListener('click', () => selectHistory(index));
      div.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectHistory(index); }
      });

      historyList.appendChild(div);
    });
  }
</script>
</body>
</html>
