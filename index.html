<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Daemon Interface</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #10b981;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        h1 span { color: var(--accent); font-weight: 600; }
        
        .input-group {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #475569; cursor: not-allowed; }

        .output-group {
            background-color: #000;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            min-height: 200px;
        }
        .output-header {
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        pre {
            margin: 0;
            color: var(--accent);
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>OMNI<span>DAEMON</span></h1>

        <div class="input-group">
            <textarea id="intentInput" placeholder="Enter a plain-English intent (e.g., 'Generate a Python script that calculates the factorial of 7 and prints it')..."></textarea>
            <button id="executeBtn" onclick="runDaemon()">Synthesize & Execute</button>
        </div>

        <div class="output-group">
            <div class="output-header">Sandbox Output</div>
            <pre id="outputDisplay">Waiting for intent...</pre>
        </div>
    </div>

    <script>
        async function runDaemon() {
            const input = document.getElementById('intentInput').value;
            const outputDisplay = document.getElementById('outputDisplay');
            const btn = document.getElementById('executeBtn');

            if (!input.trim()) return;

            // UI Loading State
            outputDisplay.textContent = "Synthesizing code and executing in sandbox...\nThis may take a few seconds.";
            outputDisplay.className = "";
            btn.disabled = true;
            btn.textContent = "Processing...";

            try {
                const response = await fetch("http://127.0.0.1:5000/omni/execute", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ intent: input })
                });
                
                const data = await response.json();
                
                if (data.status === "success") {
                    outputDisplay.textContent = data.sandbox_output.output;
                } else {
                    outputDisplay.textContent = `Execution Error:\n${data.error}`;
                    outputDisplay.className = "error";
                }
            } catch (error) {
                outputDisplay.textContent = "Network Error: Could not connect to Omni-Daemon. Make sure daemon.py is running.";
                outputDisplay.className = "error";
            } finally {
                // Reset UI
                btn.disabled = false;
                btn.textContent = "Synthesize & Execute";
            }
        }
    </script>
</body>
</html>
